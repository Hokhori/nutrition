name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Qualité : typecheck + lint + build (runner GitHub-hosted) ───────────────
  quality:
    name: Qualité (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        # Version de pnpm lue depuis le champ packageManager du package.json.
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build


  # ── Image : build & push GHCR (le VPS ne build plus, il pull) ───────────────
  # Même garde que le déploiement : jamais sur un fork ni sur une PR.
  build:
    name: Build & push image (GHCR)
    needs: quality
    if: >-
      github.repository == 'Hokhori/nutrition' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/hokhori/nutrition:latest
            ghcr.io/hokhori/nutrition:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Déploiement : sur push main, par SSH depuis un runner GitHub-hosted ─────
  # Spécifique à l'instance officielle Hokhori. Les forks de la communauté ne
  # l'exécutent pas (github.repository ≠ Hokhori/nutrition) : chez eux, seul le
  # job « quality » tourne. Voir le README pour héberger votre propre instance.
  #
  # Sécurité : pas de runner self-hosted (aucune exécution de code de fork sur le
  # VPS). Le déploiement se fait par SSH avec une clé dédiée stockée en secret ;
  # GitHub n'expose jamais les secrets aux PR de forks.
  deploy:
    name: Déploiement VPS
    needs: build
    permissions:
      contents: read
      packages: read
    if: >-
      github.repository == 'Hokhori/nutrition' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Configurer la clé SSH de déploiement
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull de l'image & redémarrage (sur le VPS)
        # Login GHCR éphémère avec le GITHUB_TOKEN du run : aucun credential
        # registre persistant sur le VPS.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" -o IdentitiesOnly=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -e; echo '$GHCR_TOKEN' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin; \
             cd '${{ vars.DEPLOY_STACK_DIR }}'; docker compose pull app; docker compose up -d; \
             docker compose ps; docker image prune -f; docker logout ghcr.io"
