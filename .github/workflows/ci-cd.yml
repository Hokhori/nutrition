name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Qualité : typecheck + lint + build (runner GitHub-hosted) ───────────────
  quality:
    name: Qualité (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  # ── Déploiement : sur push main, par SSH depuis un runner GitHub-hosted ─────
  # Spécifique à l'instance officielle Hokhori. Les forks de la communauté ne
  # l'exécutent pas (github.repository ≠ Hokhori/nutrition) : chez eux, seul le
  # job « quality » tourne. Voir le README pour héberger votre propre instance.
  #
  # Sécurité : pas de runner self-hosted (aucune exécution de code de fork sur le
  # VPS). Le déploiement se fait par SSH avec une clé dédiée stockée en secret ;
  # GitHub n'expose jamais les secrets aux PR de forks.
  deploy:
    name: Déploiement VPS
    needs: quality
    if: >-
      github.repository == 'Hokhori/nutrition' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configurer la clé SSH de déploiement
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Synchroniser le code vers le VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} -o IdentitiesOnly=yes" \
            --exclude '.git' --exclude 'node_modules' --exclude '.next' \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ vars.DEPLOY_REPO_DIR }}/"

      - name: Rebuild, redémarrage & nettoyage (sur le VPS)
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" -o IdentitiesOnly=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd '${{ vars.DEPLOY_STACK_DIR }}' && docker compose up -d --build && docker compose ps && docker image prune -f"
