name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Qualité : typecheck + lint + build (runner GitHub-hosted) ───────────────
  quality:
    name: Qualité (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  # ── Déploiement : sur push main, sur le runner self-hosted du VPS ───────────
  # Spécifique à l'instance officielle Hokhori. Les forks de la communauté ne
  # l'exécutent pas (github.repository ≠ Hokhori/nutrition) : chez eux, seul le
  # job « quality » tourne. Voir le README pour héberger votre propre instance.
  deploy:
    name: Déploiement VPS
    needs: quality
    if: >-
      github.repository == 'Hokhori/nutrition' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    runs-on: [self-hosted, vps]
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Synchroniser le code vers le dépôt de build
        run: |
          rsync -a --delete \
            --exclude '.git' --exclude 'node_modules' --exclude '.next' \
            "$GITHUB_WORKSPACE/" /home/administrator/repos/nutrition/

      - name: Rebuild & redémarrage du conteneur
        run: |
          cd /home/administrator/stacks/nutrition
          docker compose up -d --build
          docker compose ps

      - name: Nettoyage images inutilisées
        run: docker image prune -f
