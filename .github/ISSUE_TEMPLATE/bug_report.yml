name: "🐛 Bug"
description: Signaler un dysfonctionnement
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Description
      description: Que se passe-t-il ? Qu'attendiez-vous à la place ?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Étapes de reproduction
      placeholder: |
        1. Aller sur…
        2. Cliquer sur…
        3. Observer…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Tag, commit, ou date du déploiement
    validations:
      required: false
  - type: textarea
    id: env
    attributes:
      label: Environnement
      description: Mode de déploiement (docker-compose, dev local…), OS, navigateur.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Logs pertinents (conteneur `app`, console navigateur). Masquez tout secret.
      render: shell
    validations:
      required: false
